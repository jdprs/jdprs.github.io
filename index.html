<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI安全与全球治理 · 下载</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --line: #262b38;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #2fd07c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(900px 500px at 50% -10%, #1c2231, #0f1117 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }
  .icon { font-size: 40px; margin-bottom: 10px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; letter-spacing: .5px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
  .btn {
    display: block;
    width: 100%;
    padding: 13px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(180deg, #2fd07c, #22b76a);
    color: #06210f;
    transition: .15s;
    margin-bottom: 12px;
    border: none;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-weight: 500;
  }
  .notice {
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 6px;
    text-align: left;
    display: none;
  }
  .notice code {
    background: #1e2330;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📄</div>
  <h1>AI安全与全球治理</h1>
  <div class="sub">演示文稿 · PowerPoint 幻灯片</div>
  <div class="meta">文件名：AI安全与全球治理.pptx　·　大小：2.3 MB</div>
  <a class="btn" id="dlBtn" href="AI安全与全球治理.pptx" download="AI安全与全球治理.pptx">立即下载 PPTX</a>
  <a class="btn secondary" id="tmpBtn" style="display:none" href="https://aka.doubaocdn.com/s/Nic46IZRKG" target="_blank" rel="noopener">临时下载通道（约一周内有效）</a>
  <div class="notice" id="notice"></div>
</div>
<script>
(() => {
  'use strict';
  const FILE = 'AI安全与全球治理.pptx';
  const dlBtn = document.getElementById('dlBtn');
  const tmpBtn = document.getElementById('tmpBtn');
  const notice = document.getElementById('notice');

  function missing() {
    dlBtn.textContent = '文件尚未就绪';
    dlBtn.removeAttribute('download');
    dlBtn.style.pointerEvents = 'none';
    dlBtn.style.opacity = '.5';
    tmpBtn.style.display = 'block';
    notice.style.display = 'block';
    notice.innerHTML =
      '仓库中还没有 <code>AI安全与全球治理.pptx</code>。' +
      '请登录 GitHub，进入 <code>jdprs/jdprs.github.io</code> 仓库，' +
      '把该文件拖拽上传到根目录，然后刷新本页即可永久下载。' +
      '（上传前可先使用下方的临时通道）';
  }

  (async () => {
    try {
      const res = await fetch(FILE, { method: 'HEAD', cache: 'no-store' });
      if (res.ok) {
        window.location.href = FILE;
      } else {
        missing();
      }
    } catch (e) {
      // 网络异常时保留主按钮，不做降级处理
    }
  })();
})();
</script>
</body>
</html>
