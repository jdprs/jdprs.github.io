<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>声音检测器</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --line: #262b38;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #38e08a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1100px 600px at 50% -10%, #1c2231, #0f1117 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
  }
  .app { width: 100%; max-width: 780px; }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: .5px;
  }
  .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  button {
    border: 1px solid var(--line);
    background: #1e2330;
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
  }
  button:hover:not(:disabled) { background: #262d3d; border-color: #384054; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #2fd07c, #22b76a);
    border-color: transparent;
    color: #06210f;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  #status { font-size: 13px; color: var(--muted); }

  .meters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .meter {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .meter .label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    white-space: nowrap;
  }
  .meter .value {
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .meter .value small {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 3px;
  }
  .meter .extra {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .wave-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 14px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 170px;
    border-radius: 8px;
  }

  .bar-wrap {
    height: 12px;
    border-radius: 8px;
    background: #1b202b;
    border: 1px solid var(--line);
    overflow: hidden;
    margin-bottom: 8px;
  }
  #levelFill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .06s linear, background .2s linear;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  @media (max-width: 560px) {
    .meters { grid-template-columns: 1fr; }
    .meter .value { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎤 声音检测器</h1>
  <div class="sub">实时波形 · 当前分贝 · 最近 10 秒平均分贝</div>

  <div class="controls">
    <button id="startBtn" class="primary">开始检测</button>
    <button id="stopBtn" disabled>停止</button>
    <span id="status">等待开始…</span>
  </div>

  <div class="meters">
    <div class="meter">
      <div class="label">当前分贝</div>
      <div class="value"><span id="currentDb">--</span><small>dB</small></div>
      <div class="extra" id="dbfs">原始：-- dBFS</div>
    </div>
    <div class="meter">
      <div class="label">最近 10 秒平均</div>
      <div class="value"><span id="avgDb">--</span><small>dB</small></div>
      <div class="extra">滑动窗口 · 能量平均</div>
    </div>
    <div class="meter">
      <div class="label">10 秒内峰值</div>
      <div class="value"><span id="peakDb">--</span><small>dB</small></div>
      <div class="extra">窗口内最大值</div>
    </div>
  </div>

  <div class="wave-box">
    <canvas id="wave"></canvas>
  </div>

  <div class="bar-wrap"><div id="levelFill"></div></div>
  <div class="scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>

  <div class="note">
    分贝为相对值（0–100 刻度），由麦克风采样计算得出，未做专业声压级校准。<br>
    如需接近真实 dB SPL，可调整代码中的 <code>CAL_OFFSET</code>（默认 100）。
  </div>
</div>

<script>
(() => {
  'use strict';

  // ======== 可调参数 ========
  const CAL_OFFSET = 100;    // dBFS -> 相对分贝的偏移量（校准用）
  const WINDOW_MS  = 10000;  // 统计窗口：10 秒
  const FFT_SIZE   = 2048;   // 时域采样点数
  // =========================

  const startBtn = document.getElementById('startBtn');
  const stopBtn  = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const curEl    = document.getElementById('currentDb');
  const avgEl    = document.getElementById('avgDb');
  const peakEl   = document.getElementById('peakDb');
  const dbfsEl   = document.getElementById('dbfs');
  const canvas   = document.getElementById('wave');
  const levelFill = document.getElementById('levelFill');

  let audioCtx = null;
  let analyser = null;
  let stream = null;
  let sourceNode = null;
  let timeData = null;

  let running = false;
  let rafId = 0;
  let smoothLevel = 0;

  /** 滑动窗口样本：{ t: 时间戳, power: rms^2, level: 分贝 } */
  let samples = [];

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  /** 根据分贝值取颜色：低=绿，高=红 */
  function colorFor(level) {
    const hue = 140 - clamp(level, 0, 100) * 1.4; // 140(绿) -> 0(红)
    return `hsl(${hue}, 85%, 58%)`;
  }

  /** 适配高分屏 */
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /** 绘制波形 */
  function drawWave() {
    const ctx = canvas.getContext('2d');
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (!w || !h) return;

    ctx.clearRect(0, 0, w, h);

    // 中线
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h / 2 + 0.5);
    ctx.lineTo(w, h / 2 + 0.5);
    ctx.stroke();

    if (!timeData) return;

    const n = timeData.length;
    const amp = (h / 2) * 0.92;

    ctx.strokeStyle = colorFor(smoothLevel);
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (let x = 0; x < w; x++) {
      const i0 = Math.floor((x * n) / w);
      const i1 = Math.max(i0 + 1, Math.floor(((x + 1) * n) / w));

      let min = 1, max = -1;
      for (let i = i0; i < i1 && i < n; i++) {
        const v = timeData[i];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      if (max < min) continue;

      const yTop = h / 2 - max * amp;
      const yBot = h / 2 - min * amp;
      const px = x + 0.5;
      ctx.moveTo(px, yTop);
      ctx.lineTo(px, Math.max(yBot, yTop + 1)); // 至少 1px，保持可见
    }
    ctx.stroke();
  }

  /** 主循环 */
  function loop() {
    if (!running) return;

    analyser.getFloatTimeDomainData(timeData);

    // ---- 1. 计算 RMS 与 dBFS ----
    let sum = 0;
    for (let i = 0; i < timeData.length; i++) {
      const v = timeData[i];
      sum += v * v;
    }
    const rms = Math.sqrt(sum / timeData.length);
    const dbfs = 20 * Math.log10(rms + 1e-8);          // 约 -160 ~ 0
    const level = clamp(dbfs + CAL_OFFSET, 0, 100);    // 映射到 0~100

    // 指数平滑，让数字不那么跳
    smoothLevel = smoothLevel > 0 ? smoothLevel * 0.75 + level * 0.25 : level;

    // ---- 2. 写入 10 秒滑动窗口 ----
    const now = performance.now();
    samples.push({ t: now, power: rms * rms, level });

    const cutoff = now - WINDOW_MS;
    while (samples.length && samples[0].t < cutoff) samples.shift();

    // ---- 3. 窗口内能量平均 + 峰值 ----
    let powerSum = 0;
    let peakLevel = 0;
    for (let i = 0; i < samples.length; i++) {
      powerSum += samples[i].power;
      if (samples[i].level > peakLevel) peakLevel = samples[i].level;
    }
    const avgRms = Math.sqrt(powerSum / samples.length);
    const avgLevel = clamp(20 * Math.log10(avgRms + 1e-8) + CAL_OFFSET, 0, 100);

    // ---- 4. 更新界面 ----
    curEl.textContent  = smoothLevel.toFixed(1);
    avgEl.textContent  = avgLevel.toFixed(1);
    peakEl.textContent = peakLevel.toFixed(1);
    dbfsEl.textContent = '原始：' + dbfs.toFixed(1) + ' dBFS';

    levelFill.style.width = smoothLevel + '%';
    levelFill.style.background = colorFor(smoothLevel);

    drawWave();

    rafId = requestAnimationFrame(loop);
  }

  /** 开始检测 */
  async function start() {
    if (running) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = '当前浏览器不支持麦克风采集（需 HTTPS 或 localhost）';
      return;
    }

    statusEl.textContent = '正在请求麦克风权限…';

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,   // 关闭处理，保留原始信号
          noiseSuppression: false,
          autoGainControl: false
        }
      });
    } catch (err) {
      statusEl.textContent = '获取麦克风失败：' + (err && err.message ? err.message : err);
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    sourceNode = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0;
    sourceNode.connect(analyser);   // 不连 destination，避免扬声器啸叫

    timeData = new Float32Array(analyser.fftSize);

    samples = [];
    smoothLevel = 0;
    running = true;

    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusEl.textContent = '检测中…';

    resizeCanvas();
    rafId = requestAnimationFrame(loop);
  }

  /** 停止检测 */
  function stop() {
    if (!running) return;
    running = false;
    cancelAnimationFrame(rafId);

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (sourceNode) { try { sourceNode.disconnect(); } catch (e) {} sourceNode = null; }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }

    analyser = null;
    timeData = null;
    samples = [];

    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusEl.textContent = '已停止';
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('beforeunload', stop);

  // 初始化画布尺寸
  resizeCanvas();
})();
</script>
</body>
</html>
